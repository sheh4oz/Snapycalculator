"0\" step=\"0.01\" value=\"0\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n  <fieldset>\n    <legend>Your costs per item<\/legend>\n    <div class=\"row\">\n      <label>Item cost (product + landed)<input id=\"cost\" type=\"number\" min=\"0\" step=\"0.01\" value=\"9\" inputmode=\"decimal\"><\/label>\n      <label>Shipping you pay<input id=\"shipOut\" type=\"number\" min=\"0\" step=\"0.01\" value=\"4.50\" inputmode=\"decimal\"><\/label>\n      <label>Packaging<input id=\"pack\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0.60\" inputmode=\"decimal\"><\/label>\n      <label>Ad spend per sale<input id=\"ads\" type=\"number\" min=\"0\" step=\"0.01\" value=\"3\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n  <fieldset>\n    <legend>Marketplace fees<\/legend>\n    <div class=\"row\">\n      <label>Referral / selling fee (%)<input id=\"refPct\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\" inputmode=\"decimal\"><\/label>\n      <label>Payment processing (%)<input id=\"procPct\" type=\"number\" min=\"0\" step=\"0.1\" value=\"2.9\" inputmode=\"decimal\"><\/label>\n      <label>Payment fixed fee<input id=\"procFix\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0.30\" inputmode=\"decimal\"><\/label>\n      <label>Fulfilment fee (e.g. FBA)<input id=\"fulfil\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n  <fieldset>\n    <legend>Planning<\/legend>\n    <div class=\"row\">\n      <label>Units sold per month<input id=\"units\" type=\"number\" min=\"0\" step=\"1\" value=\"100\" inputmode=\"numeric\"><\/label>\n      <label>Target margin (%)<input id=\"target\" type=\"number\" min=\"0\" max=\"90\" step=\"1\" value=\"30\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n  <label>Currency symbol\n    <select id=\"cur\"><option value=\"$\">USD $<\/option><option value=\"\u20ac\">EUR \u20ac<\/option><option value=\"\u00a3\">GBP \u00a3<\/option><option value=\"CA$\">CAD CA$<\/option><option value=\"A$\">AUD A$<\/option><option value=\"CHF \">CHF<\/option><option value=\"SEK \">SEK<\/option><option value=\"NOK \">NOK<\/option><option value=\"DKK \">DKK<\/option><option value=\"PLN \">PLN<\/option><option value=\"\u00a5\">JPY \u00a5<\/option><option value=\"S$\">SGD S$<\/option><option value=\"HK$\">HKD HK$<\/option><option value=\"AED \">AED<\/option><option value=\"SAR \">SAR<\/option><option value=\"\u20b9\">INR \u20b9<\/option><option value=\"Rs \">PKR Rs<\/option><\/select>\n  <\/label>\n<\/section>\n\n<section class=\"panel\" aria-live=\"polite\" aria-label=\"Results\">\n  <h2>Net profit per sale<\/h2>\n  <div id=\"profit\" class=\"big\">\u2013<\/div>\n  <p class=\"sub\" id=\"margin\"><\/p>\n  <div class=\"bar\" id=\"bar\" role=\"img\" aria-label=\"Where the sale price goes\"><\/div>\n  <div class=\"legend\">\n    <span><i style=\"background:var(--c-cost)\"><\/i>Item &amp; packaging<\/span>\n    <span><i style=\"background:var(--c-ship)\"><\/i>Shipping<\/span>\n    <span><i style=\"background:var(--c-fee)\"><\/i>Fees<\/span>\n    <span><i style=\"background:var(--c-ads)\"><\/i>Ads<\/span>\n    <span><i style=\"background:var(--gain)\"><\/i>Profit<\/span>\n  <\/div>\n  <table class=\"receipt\" id=\"receipt\"><\/table>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"roi\">\u2013<\/b><small>Return on cost<\/small><\/div>\n    <div class=\"stat\"><b id=\"monthly\">\u2013<\/b><small>Profit per month<\/small><\/div>\n    <div class=\"stat\"><b id=\"be\">\u2013<\/b><small>Break-even price<\/small><\/div>\n    <div class=\"stat\"><b id=\"tp\">\u2013<\/b><small>Price for target margin<\/small><\/div>\n  <\/div>\n  <p class=\"note\">Presets are starting points. Fees change by category, plan and country, so check your current Shopify plan and Amazon rate card and edit the fee fields to match.<\/p>\n<\/section>\n<\/div>\n<section class=\"panel\" style=\"margin-top:20px\" aria-label=\"Currency converter\" aria-live=\"polite\">\n  <h2>Currency converter<\/h2>\n  <div class=\"cv\">\n    <label>Amount<input id=\"ca2\" type=\"number\" min=\"0\" step=\"any\" value=\"100\" inputmode=\"decimal\"><\/label>\n    <label>From<select id=\"cf\"><\/select><\/label>\n    <button class=\"cvb\" id=\"cs\" type=\"button\" aria-label=\"Swap currencies\">\u21c4<\/button>\n    <label>To<select id=\"ct\"><\/select><\/label>\n  <\/div>\n  <div class=\"big\" style=\"font-size:clamp(28px,6vw,40px)\" id=\"cout\">\u2013<\/div>\n  <p class=\"sub\" id=\"crl\"><\/p>\n  <div style=\"margin-top:12px\"><button class=\"cvb\" id=\"useVal\" type=\"button\">Convert my net profit per sale<\/button><\/div>\n  <details style=\"margin-top:14px\"><summary>Edit exchange rates (units per 1 USD)<\/summary><div class=\"rates\" id=\"cr\"><\/div><button class=\"cvb\" id=\"crs\" type=\"button\">Reset rates<\/button><\/details>\n  <p class=\"note\">Rates are a saved snapshot from 14 October 2026. Edit them to match your bank or payment provider.<\/p>\n<\/section>\n<section class=\"panel\" id=\"inv\" style=\"margin-top:20px\" aria-label=\"Quotation and invoice\">\n  <h2>Quotation and invoice<\/h2>\n  <p class=\"sub\" style=\"margin-bottom:12px\">Fill in the details, then download a PDF or print it. Use \u201cFill from calculator\u201d to add this page\u2019s numbers as line items.<\/p>\n  <div class=\"ivg\">\n    <label>Document type<select id=\"ivType\"><option>Quotation<\/option><option>Invoice<\/option><\/select><\/label>\n    <label>Document number<input id=\"ivNo\" type=\"text\"><\/label>\n    <label>Your business name<input id=\"ivBiz\" type=\"text\" placeholder=\"Your name or company\"><\/label>\n    <label>Client name<input id=\"ivCli\" type=\"text\" placeholder=\"Client name or company\"><\/label>\n    <label>Your details (address, email, phone, tax ID)<textarea id=\"ivBizD\"><\/textarea><\/label>\n    <label>Client details<textarea id=\"ivCliD\"><\/textarea><\/label>\n    <label>Date<input id=\"ivDate\" type=\"date\"><\/label>\n    <label><span id=\"ivDueL\">Valid until<\/span><input id=\"ivDue\" type=\"date\"><\/label>\n  <\/div>\n  <h3 style=\"margin:18px 0 8px;font-size:15px\">Line items<\/h3>\n  <div id=\"ivLines\"><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"ivb\" id=\"ivAdd\" type=\"button\">Add line<\/button><button class=\"ivb\" id=\"ivFill\" type=\"button\">Fill from calculator<\/button><\/div>\n  <div class=\"ivg\" style=\"margin-top:12px\">\n    <label>Tax or VAT (%)<input id=\"ivTax\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\" inputmode=\"decimal\"><\/label>\n    <label>Notes and terms<textarea id=\"ivNotes\" placeholder=\"Payment terms, bank details, thank you note\"><\/textarea><\/label>\n  <\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\"><button class=\"ivb solid\" id=\"ivPdf\" type=\"button\">Download PDF<\/button><button class=\"ivb\" id=\"ivPrint\" type=\"button\">Print<\/button><\/div>\n  <p class=\"note\" id=\"ivMsg\" role=\"status\"><\/p>\n  <div id=\"docp\" aria-label=\"Document preview\"><\/div>\n<\/section>\n<article class=\"prose\">\n\n<h2>How the profit calculator works<\/h2>\n<p>This calculator shows what you keep from one sale on Shopify, Amazon or any other marketplace. It starts with your revenue, which is the selling price plus any shipping you charge the customer. Then it subtracts every cost tied to that sale: the item cost, packaging, shipping you pay, ad spend per sale, the marketplace referral fee, payment processing (a percentage plus a fixed fee), and any fulfilment fee such as Amazon FBA.<\/p>\n<p>What is left is your net profit per sale. Net margin is that profit divided by revenue. Return on cost is profit divided by what you spent on the item, shipping and ads.<\/p>\n<h3>Break-even price and target margin<\/h3>\n<p>The break-even price is the lowest price at which you make exactly zero profit after fees. The calculator also works backwards from a margin you choose and shows the price you need to charge to reach it. Because most fees are a percentage of the price, a higher price raises the fees too, so the calculator accounts for that instead of just adding a markup.<\/p>\n<h2>Example<\/h2>\n<p>Say you sell a product for 29.99. The item costs 9.00, packaging is 0.60, you pay 4.50 for shipping and spend 3.00 on ads per sale. On a Shopify-style setup with 2.9% plus 0.30 payment processing, the fee is about 1.17. Your total costs come to about 18.27, so your net profit is about 11.72 per sale, a net margin of roughly 39%. Change any number and the result updates straight away.<\/p>\n<h2>Frequently asked questions<\/h2>\n<h3>Are the Shopify and Amazon presets exact?<\/h3>\n<p>No. They are starting points. Fees depend on your Shopify plan, your product category, your country and the fulfilment method. Check your current rate card and edit the fee fields to match.<\/p>\n<h3>What is a good profit margin?<\/h3>\n<p>It depends on your category, volume and how much you spend on ads. Many sellers want enough margin left after ads to cover returns, time and growth. Use the target margin field to see what price that margin requires.<\/p>\n<h3>Does it include income tax or sales tax?<\/h3>\n<p>No. It shows profit before income tax. Sales tax or VAT collected from customers is not part of your revenue here.<\/p>\n<h3>Is my data saved?<\/h3>\n<p>No. Everything is calculated in your browser, and nothing you type is sent to a server.<\/p>\n\n<div class=\"adslot\"><!-- Ad unit goes here --><\/div>\n<\/article>\n<\/main>\n<footer class=\"site\"><div>\n<a href=\"../about/\">About<\/a> <a href=\"../contact/\">Contact<\/a> <a href=\"../privacy-policy/\">Privacy policy<\/a>\n<p>\u00a9 2026 Pricing Calculators. These calculators give estimates for planning. They are not tax, legal or financial advice.<\/p><\/div><\/footer>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script>\n(function(){\nvar $=function(id (99,102,241,.17),transparent 60%),radial-gradient(640px 520px at 50% 100%,rgba(56,189,248,.11),transparent 60%);animation:drift 22s ease-in-out infinite alternate}\nbody::after{content:\"\";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%);animation:grid 30s linear infinite}\n@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.1)}}\n@keyframes grid{to{background-position:48px 48px,48px 48px}}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\nh1,.hero h1{background:linear-gradient(90deg,#fff 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}\n.hero,h1,.lead,.panel,.card,.prose{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}\n.lead{animation-delay:.08s}.panel,.card{animation-delay:.14s}.card:nth-child(2){animation-delay:.22s}.card:nth-child(3){animation-delay:.3s}\n.panel,.card{background:rgba(9,22,40,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .25s,box-shadow .25s,transform .25s}\n.panel:hover{border-color:rgba(var(--glow),.35)}\n.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 16px 44px -14px rgba(var(--glow),.45)}\nnav a{transition:color .2s,border-color .2s,background .2s,transform .2s,box-shadow .2s}\nnav a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}\nnav a[aria-current=\"page\"],.tabs button[aria-pressed=\"true\"],.btn:not(.ghost),.ivb.solid,.btn.solid{background:linear-gradient(135deg,var(--accent),#38bdf8);color:#02121a;border-color:transparent}\nnav a[aria-current=\"page\"]:hover{color:#02121a}\n.btn,.ivb,.cvb,.btn2,.tabs button,.mat .x{transition:transform .2s,box-shadow .2s,border-color .2s,background .2s,color .2s}\n.btn:hover,.ivb:hover,.cvb:hover,.btn2:hover,.tabs button:hover,.mat .x:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(var(--glow),.6);border-color:var(--accent)}\n.btn:active,.ivb:active,.cvb:active,.btn2:active,.tabs button:active{transform:translateY(0) scale(.97)}\n.btn.ghost:hover,.ivb:not(.solid):hover,.cvb:hover,.btn2:hover{color:var(--accent)}\ninput,select,textarea{transition:border-color .2s,box-shadow .2s}\ninput:hover,select:hover,textarea:hover{border-color:rgba(var(--glow),.5)}\ninput:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--glow),.2);outline:0}\na{transition:color .2s}\nfooter.site a:hover,.prose a:hover{color:var(--accent)}\nsummary{transition:color .2s}summary:hover{color:var(--accent)}\n.bar span{transition:width .45s cubic-bezier(.2,.7,.2,1)}\n::selection{background:rgba(var(--glow),.35)}\n@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}.hero,h1,.lead,.panel,.card,.prose{animation:none}*{transition:none!important}}\n@media print{body::before,body::after{display:none}html,body{background:#fff!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<nav aria-label=\"Main\">\n  <a href=\"../\">Home<\/a>\n  <a href=\"../profit-calculator/\">Profit calculator<\/a>\n  <a href=\"../product-cost-calculator/\" aria-current=\"page\">Product cost calculator<\/a>\n  <a href=\"../freelance-rate-calculator/\">Freelance rate calculator<\/a>\n  <a href=\"../about/\">About<\/a>\n<\/nav>\n<h1>What does it cost you to make one unit?<\/h1>\n<p class=\"lead\">Add your raw materials, making costs, packaging and marketing for one batch. You get the final cost of each unit and the price you need to charge.<\/p>\n\n<div class=\"grid\">\n<section class=\"panel\" aria-label=\"Inputs\">\n  <fieldset>\n    <legend>Batch<\/legend>\n    <div class=\"row\">\n ><input id=\"rate\" type=\"number\" min=\"0\" step=\"0.01\" value=\"150\" inputmode=\"decimal\"><\/label>\n    <\/div>\n    <div class=\"row\" style=\"margin-top:10px\">\n      <label>Electricity, gas, fuel<input id=\"power\" type=\"number\" min=\"0\" step=\"0.01\" value=\"400\" inputmode=\"decimal\"><\/label>\n      <label>Rent, machine wear, other overhead<input id=\"over\" type=\"number\" min=\"0\" step=\"0.01\" value=\"600\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n\n  <fieldset>\n    <legend>Packaging (per unit)<\/legend>\n    <div class=\"row\">\n      <label>Box / bag / bottle<input id=\"pk1\" type=\"number\" min=\"0\" step=\"0.01\" value=\"25\" inputmode=\"decimal\"><\/label>\n      <label>Label, sticker, insert<input id=\"pk2\" type=\"number\" min=\"0\" step=\"0.01\" value=\"8\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n\n  <fieldset>\n    <legend>Marketing and selling<\/legend>\n    <div class=\"row\">\n      <label>Ads, photos, samples for this batch<input id=\"mkt\" type=\"number\" min=\"0\" step=\"0.01\" value=\"3000\" inputmode=\"decimal\"><\/label>\n      <label>Delivery or commission per unit<input id=\"del\" type=\"number\" min=\"0\" step=\"0.01\" value=\"40\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n\n  <fieldset>\n    <legend>Other<\/legend>\n    <div class=\"row\">\n      <label>Other costs for the batch<input id=\"oth\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0\" inputmode=\"decimal\"><\/label>\n      <label>Margin you want on the price (%)<input id=\"margin\" type=\"number\" min=\"0\" max=\"90\" step=\"1\" value=\"30\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n<\/section>\n\n<section class=\"panel\" aria-live=\"polite\" aria-label=\"Results\">\n  <h2>Final cost per unit<\/h2>\n  <div id=\"perUnit\" class=\"big\">\u2013<\/div>\n  <p class=\"sub\" id=\"totalLine\"><\/p>\n  <div class=\"bar\" id=\"bar\" role=\"img\" aria-label=\"Share of each cost group\"><\/div>\n  <div class=\"legend\">\n    <span><i style=\"background:var(--c1)\"><\/i>Raw materials<\/span>\n    <span><i style=\"background:var(--c2)\"><\/i>Making<\/span>\n    <span><i style=\"background:var(--c4)\"><\/i>Packaging<\/span>\n    <span><i style=\"background:var(--c3)\"><\/i>Marketing &amp; selling<\/span>\n    <span><i style=\"background:var(--c5)\"><\/i>Other<\/span>\n  <\/div>\n  <table class=\"receipt\" id=\"receipt\"><\/table>\n\n  <div class=\"price\">\n    <div class=\"sub\">Sell at this price to reach your margin<\/div>\n    <b id=\"sell\">\u2013<\/b>\n    <div class=\"sub\" id=\"profitLine\"><\/div>\n    <label style=\"margin-top:12px\">Or test your own selling price<input id=\"mine\" type=\"number\" min=\"0\" step=\"0.01\" placeholder=\"Enter a price\" inputmode=\"decimal\"><\/label>\n    <div class=\"sub\" id=\"mineLine\" style=\"margin-top:6px\"><\/div>\n  <\/div>\n\n  <div class=\"actions\">\n    <button class=\"btn\" id=\"copy\" type=\"button\">Copy cost per unit<\/button>\n    <a class=\"btn ghost\" href=\"https://claude.ai/artifact/G9iGFCTCyTKvmgtVumkgQ3\" target=\"_top\">Open profit calculator<\/a>\n  <\/div>\n  <p class=\"note\" id=\"msg\" role=\"status\"><\/p>\n  <p class=\"note\">Costs are spread over the units you can actually sell, after wasted or rejected units. Marketing for the batch is included in the unit cost.<\/p>\n<\/section>\n<\/div>\n<section class=\"panel\" style=\"margin-top:20px\" aria-label=\"Currency converter\" aria-live=\"polite\">\n  <h2>Currency converter<\/h2>\n  <div class=\"cv\">\n    <label>Amount<input id=\"ca2\" type=\"number\" min=\"0\" step=\"any\" value=\"100\" inputmode=\"decimal\"><\/label>\n    <label>From<select id=\"cf\"><\/select><\/label>\n    <button class=\"cvb\" id=\"cs\" type=\"button\" aria-label=\"Swap currencies\">\u21c4<\/button>\n    <label>To<select id=\"ct\"><\/select><\/label>\n  <\/div>\n  <div class=\"big\" style=\"font-size:clamp(28px,6vw,40px)\" id=\"cout\">\u2013<\/div>\n  <p class=\"sub\" id=\"crl\"><\/p>\n  <div style=\"margin-top:12px\"><button class=\"cvb\" id=\"useVal\" type=\"button\">Convert my cost per unit<\/button><\/div>\n  <details style=\"margin-top:14px\"><summary>Edit exchange rates (units per 1 USD)<\/summary><div class=\"rates\" id=\"cr\"><\/div><button class=\"cvb\" id=\"crs\" type=\"button\">Reset rates<\/button><\/details>\n  <p class=\"note\">Rates are a saved snapshot from 14 October 2026. Edit them to match your bank or payment provider.<\/p>\n<\/section>\n<section class=\"panel\" id=\"inv\" style=\"margin-top:20px\" aria-label=\"Quotation and invoice\">\n  <h2>Quotation and invoice<\/h2>\n  <p class=\"sub\" style=\"margin-bottom:12px\">Fill in the details, then download a PDF or print it. Use \u201cFill from calculator\u201d to add this page\u2019s numbers as line items.<\/p>\n  <div class=\"ivg\">\n    <label>Document type<select id=\"ivType\"><option>Quotation<\/option><option>Invoice<\/option><\/select><\/label>\n    <label>Document number<input id=\"ivNo\" type=\"text\"><\/label>\n    <label>Your business name<input id=\"ivBiz\" type=\"text\" placeholder=\"Your name or company\"><\/label>\n    <label>Client name<input id=\"ivCli\" type=\"text\" placeholder=\"Client name or company\"><\/label>\n    <label>Your details (address, email, phone, tax ID)<textarea id=\"ivBizD\"><\/textarea><\/label>\n    <label>Client details<textarea id=\"ivCliD\"><\/textarea><\/label>\n    <label>Date<input id=\"ivDate\" type=\"date\"><\/label>\n    <label><span id=\"ivDueL\">Valid until<\/span><input id=\"ivDue\" type=\"date\"><\/label>\n  <\/div>\n  <h3 style=\"margin:18px 0 8px;font-size:15px\">Line items<\/h3>\n  <div id=\"ivLines\"><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"ivb\" id=\"ivAdd\" type=\"button\">Add line<\/button><button class=\"ivb\" id=\"ivFill\" type=\"button\">Fill from calculator<\/button><\/div>\n  <div class=\"ivg\" style=\"margin-top:12px\">\n    <label>Tax or VAT (%)<input id=\"ivTax\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\" inputmode=\"decimal\"><\/label>\n    <label>Notes and terms<textarea id=\"ivNotes\" placeholder=\"Payment terms, bank details, thank you note\"><\/textarea><\/label>\n  <\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\"><button class=\"ivb solid\" id=\"ivPdf\" type=\"button\">Download PDF<\/button><button class=\"ivb\" id=\"ivPrint\" type=\"button\">Print<\/button><\/div>\n  <p class=\"note\" id=\"ivMsg\" role=\"status\"><\/p>\n  <div id=\"docp\" aria-label=\"Document preview\"><\/div>\n<\/section>\n<article class=\"prose\">\n\n<h2>How to work out the final cost of a product<\/h2>\n<p>This calculator finds the true cost of making one unit. You enter everything for a whole batch: raw materials, labour, electricity and fuel, rent and overhead, packaging, marketing, delivery or commission, and any other costs. It adds them up and divides the total by the number of units you can actually sell.<\/p>\n<h3>Why wasted units matter<\/h3>\n<p>If you make 100 units and 3 are damaged or rejected, you only have 97 to sell. The whole batch cost has to be covered by those 97, so the cost per unit is higher than a simple division by 100. The calculator does this for you through the wasted units field.<\/p>\n<h3>Labour: hourly, daily or one-time<\/h3>\n<p>Pay labour per hour, per day, or as a single one-time amount for the batch. Pick the option that matches how you really pay your workers.<\/p>\n<h2>Example<\/h2>\n<p>Suppose a batch of 100 units costs 12,000 in total across materials, labour, overhead, packaging and marketing. With 3% wasted, you sell 97 units. The final cost per unit is 12,000 divided by 97, which is about 123.71. To earn a 30% margin, the selling price is the cost divided by 0.70, about 176.73.<\/p>\n<h3>Margin is not markup<\/h3>\n<p>A 30% margin means profit is 30% of the selling price. A 30% markup means you add 30% on top of the cost. They give different prices, and this calculator uses margin. Use the profit calculator on this site to see how marketplace fees reduce what you keep.<\/p>\n<h2>Frequently asked questions<\/h2>\n<h3>Should I include marketing in the cost of a product?<\/h3>\n<p>If you spend on ads, photos or samples to sell a batch, including them shows the real cost of getting that batch sold. You can also leave marketing at zero and treat it separately.<\/p>\n<h3>What overhead should I include?<\/h3>\n<p>Include the share of rent, machine wear, utilities and other fixed costs that belongs to this batch.<\/p>\n<h3>Can I use this for imported goods?<\/h3>\n<p>Yes. Add freight, customs duty, taxes and clearing fees in the other costs field, and use the currency converter below for supplier prices in another currency.<\/p>\n\n<div class=\"adslot\"><!-- Ad unit goes here --><\/div>\n<\/article>\n<\/main>\n<footer class=\"site\"><div>\n<a href=\"../about/\">About<\/a> <a href=\"../contact/\">Contact<\/a> <a href=\"../privacy-policy/\">Privacy policy<\/a>\n<p>\u00a9 2026 Pricing Calculators. These calculators give estimates for planning. They are not tax, legal or financial advice.<\/p><\/div><\/footer>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script>\n(function(){\nvar $=function(id){return document.getElementById(id)};\nfunction v(el){var x=parseFloat(typeof el===\"string\"?$(el).value:el.value);return isFinite(x)?x:0}\nfunction money(n){var s=n<0?\"\u2212\":\"\";return s+$(\"cur\").value+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}\nvar last=0;\nfunction addMat(name,qty,price){\n var d=document.createElement(\"div\");d.className=\"mat\";\n d.innerHTML='<label><span>Material<\/span><input class=\"mn\" type=\"text\" placeholder=\"e.g. Cotton fabric\" aria-label=\"Material name\"><\/label>'+\n '<label><span>Quantity<\/span><input class=\"mq\" type=\"number\" min=\"0\" step=\"0.01\" inputmode=\"decimal\" aria-label=\"Quantity\"> e at center,#000 25%,transparent 78%);animation:grid 30s linear infinite}\n@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.1)}}\n@keyframes grid{to{background-position:48px 48px,48px 48px}}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\nh1,.hero h1{background:linear-gradient(90deg,#fff 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}\n.hero,h1,.lead,.panel,.card,.prose{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}\n.lead{animation-delay:.08s}.panel,.card{animation-delay:.14s}.card:nth-child(2){animation-delay:.22s}.card:nth-child(3){animation-delay:.3s}\n.panel,.card{background:rgba(9,22,40,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .25s,box-shadow .25s,transform .25s}\n.panel:hover{border-color:rgba(var(--glow),.35)}\n.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 16px 44px -14px rgba(var(--glow),.45)}\nnav a{transition:color .2s,border-color .2s,background .2s,transform .2s,box-shadow .2s}\nnav a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}\nnav a[aria-current=\"page\"],.tabs button[aria-pressed=\"true\"],.btn:not(.ghost),.ivb.solid,.btn.solid{background:linear-gradient(135deg,var(--accent),#38bdf8);color:#02121a;border-color:transparent}\nnav a[aria-current=\"page\"]:hover{color:#02121a}\n.btn,.ivb,.cvb,.btn2,.tabs button,.mat .x{transition:transform .2s,box-shadow .2s,border-color .2s,background .2s,color .2s}\n.btn:hover,.ivb:hover,.cvb:hover,.btn2:hover,.tabs button:hover,.mat .x:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(var(--glow),.6);border-color:var(--accent)}\n.btn:active,.ivb:active,.cvb:active,.btn2:active,.tabs button:active{transform:translateY(0) scale(.97)}\n.btn.ghost:hover,.ivb:not(.solid):hover,.cvb:hover,.btn2:hover{color:var(--accent)}\ninput,select,textarea{transi 25\u201335%).<\/p>\n    <div class=\"row\" style=\"margin-top:10px\">\n    <label>Your currency\n      <select id=\"cur\"><option value=\"$\">USD $<\/option><option value=\"\u20ac\">EUR \u20ac<\/option><option value=\"\u00a3\">GBP \u00a3<\/option><option value=\"CA$\">CAD CA$<\/option><option value=\"A$\">AUD A$<\/option><option value=\"CHF \">CHF<\/option><option value=\"SEK \">SEK<\/option><option value=\"NOK \">NOK<\/option><option value=\"DKK \">DKK<\/option><option value=\"PLN \">PLN<\/option><option value=\"\u00a5\">JPY \u00a5<\/option><option value=\"S$\">SGD S$<\/option><option value=\"HK$\">HKD HK$<\/option><option value=\"AED \">AED<\/option><option value=\"SAR \">SAR<\/option><option value=\"\u20b9\">INR \u20b9<\/option><option value=\"Rs \">PKR Rs<\/option><\/select>\n    <\/label>\n    <label>Also show quote in (optional)\n      <select id=\"cur2\"><option value=\"\">None<\/option><option>USD<\/option><option>EUR<\/option><option>GBP<\/option><option>CAD<\/option><option>AUD<\/option><option>CHF<\/option><option>SEK<\/option><option>NOK<\/option><option>DKK<\/option><option>PLN<\/option><option>JPY<\/option><option>SGD<\/option><option>HKD<\/option><option>AED<\/option><option>SAR<\/option><option>INR<\/option><option>PKR<\/option><\/select>\n    <\/label>\n    <\/div>\n  <\/fieldset>\n\n  <fieldset>\n    <legend>Your time<\/legend>\n    <div class=\"row\">\n      <label>Weeks off per year (holidays, sick, vacation)<input id=\"off\" type=\"number\" min=\"0\" max=\"51\" step=\"1\" value=\"6\" inputmode=\"numeric\"><\/label>\n      <label>Billable hours per week<input id=\"bh\" type=\"number\" min=\"1\" max=\"80\" step=\"1\" value=\"25\" inputmode=\"decimal\"><\/label>\n    <\/div>\n    <p class=\"hint\" style=\"margin-top:8px\">Most freelancers bill 20\u201330 hours a week. The rest goes to admin, sales and learning.<\/p>\n  <\/fieldset>\n\n  <fieldset>\n    <legend>Business costs<\/legend>\n    <p class=\"hint\">Enter what you pay for each item and choose per month or per year. Set unused items to 0.<\/p>\n    <div id=\"costs\"><\/div>\n    <label style=\"margin-top:10px\">Payment and invoicing fees (% of what you bill)<input id=\"fee\" type=\"number\" min=\"0\" max=\"20\" step=\"0.1\" value=\"3\" inputmode=\"decimal\"><\/label>\n  <\/fieldset>\n\n  <fieldset>\n    <legend>The project<\/legend>\n    <div class=\"row\">\n      <label>Estimated hours of work<input id=\"hrs\" type=\"number\" min=\"0\" step=\"0.5\" value=\"40\" inputmode=\"decimal\"><\/label>\n      <label>Buffer for revisions and scope creep (%)<input id=\"buf\" type=\"number\" min=\"0\" max=\"200\" step=\"1\" value=\"20\" inputmode=\"decimal\"><\/label>\n      <label>Project expenses (stock assets, plugins, contractors)<input id=\"exp\" type=\"number\" min=\"0\" step=\"1\" value=\"0\" inputmode=\"decimal\"><\/label>\n      <label>Deposit upfront (%)<input id=\"dep\" type=\"number\" min=\"0\" max=\"100\" step=\"5\" value=\"50\" inputmode=\"decimal\"><\/label>\n    <\/div>\n  <\/fieldset>\n<\/section>\n\n<section class=\"panel\" aria-live=\"polite\" aria-label=\"Results\">\n  <h2>Your hourly rate<\/h2>\n  <div id=\"rate\" class=\"big\">\u2013<\/div>\n  <p class=\"sub\" id=\"rateLine\"><\/p>\n  <div class=\"bar\" id=\"bar\" role=\"img\" aria-label=\"Where your yearly billings go\"><\/div>\n  <div class=\"legend\">\n    <span><i style=\"background:var(--c1)\"><\/i>Your take-home<\/span>\n    <span><i style=\"background:var(--c2)\"><\/i>Tax<\/span>\n    <span><i style=\"background:var(--c4)\"><\/i>Business costs<\/span>\n    <span><i style=\"background:var(--c3)\"><\/i>Fees<\/span>\n  <\/div>\n  <table class=\"receipt\" id=\"receipt\"><\/table>\n\n  <div class=\"quote\">\n    <div class=\"sub\">Quote this project at<\/div>\n    <b class=\"q\" id=\"quote\">\u2013<\/b>\n    <p class=\"sub\" id=\"qLine\"><\/p>\n    <p class=\"sub\" id=\"depLine\"><\/p>\n    <p class=\"sub\" id=\"overLine\"><\/p>\n    <p class=\"sub\" id=\"convLine\" style=\"font-weight:600\"><\/p>\n    <button class=\"btn\" id=\"copy\" type=\"button\">Copy quote<\/button>\n    <p class=\"note\" id=\"msg\" role=\"status\" style=\"margin:8px 0 0\"><\/p>\n  <\/div>\n  <p class=\"note\">Business costs are treated as tax deductible. Converted amounts use a saved snapshot of exchange rates from 14 October 2026, so check the live rate before you send a quote. Tax rules differ by country and state, so use this for planning and confirm your numbers with an accountant.<\/p>\n<\/section>\n<\/div>\n<section class=\"panel\" style=\"margin-top:20px\" aria-label=\"Currency converter\" aria-live=\"polite\">\n  <h2>Currency converter<\/h2>\n  <div class=\"cv\">\n    <label>Amount<input id=\"ca2\" type=\"number\" min=\"0\" step=\"any\" value=\"100\" inputmode=\"decimal\"><\/label>\n    <label>From<select id=\"cf\"><\/select><\/label>\n    <button class=\"btn2\" id=\"cs\" type=\"button\" aria-label=\"Swap currencies\">\u21c4<\/button>\n    <label>To<select id=\"ct\"><\/select><\/label>\n  <\/div>\n  <div class=\"big\" style=\"font-size:clamp(28px,6vw,40px)\" id=\"cout\">\u2013<\/div>\n  <p class=\"sub\" id=\"crl\"><\/p>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px\"><button class=\"btn\" style=\"margin:0\" id=\"useRate\" type=\"button\">Convert my hourly rate<\/button><button class=\"btn\" style=\"margin:0\" id=\"useQuote\" type=\"button\">Convert my project quote<\/button><\/div>\n  <details style=\"margin-top:14px\"><summary>Edit exchange rates (units per 1 USD)<\/summary><div class=\"rates\" id=\"cr\"><\/div><button class=\"btn\" style=\"margin:0\" id=\"crs\" type=\"button\">Reset rates<\/button><\/details>\n  <p class=\"note\">Rates are a saved snapshot from 14 October 2026. Edit them to match your bank or payment provider.<\/p>\n<\/section>\n<section class=\"panel\" id=\"inv\" style=\"margin-top:20px\" aria-label=\"Quotation and invoice\">\n  <h2>Quotation and invoice<\/h2>\n  <p class=\"sub\" style=\"margin-bottom:12px\">Fill in the details, then download a PDF or print it. Use \u201cFill from calculator\u201d to add this page\u2019s numbers as line items.<\/p>\n  <div class=\"ivg\">\n    <label>Document type<select id=\"ivType\"><option>Quotation<\/option><option>Invoice<\/option><\/select><\/label>\n    <label>Document number<input id=\"ivNo\" type=\"text\"><\/label>\n    <label>Your business name<input id=\"ivBiz\" type=\"text\" placeholder=\"Your name or company\"><\/label>\n    <label>Client name<input id=\"ivCli\" type=\"text\" placeholder=\"Client name or company\"><\/label>\n    <label>Your details (address, email, phone, tax ID)<textarea id=\"ivBizD\"><\/textarea><\/label>\n    <label>Client details<textarea id=\"ivCliD\"><\/textarea><\/label>\n    <label>Date<input id=\"ivDate\" type=\"date\"><\/label>\n    <label><span id=\"ivDueL\">Valid until<\/span><input id=\"ivDue\" type=\"date\"><\/label>\n  <\/div>\n  <h3 style=\"margin:18px 0 8px;font-size:15px\">Line items<\/h3>\n  <div id=\"ivLines\"><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"ivb\" id=\"ivAdd\" type=\"button\">Add line<\/button><button class=\"ivb\" id=\"ivFill\" type=\"button\">Fill from calculator<\/button><\/div>\n  <div class=\"ivg\" style=\"margin-top:12px\">\n    <label>Tax or VAT (%)<input id=\"ivTax\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\" inputmode=\"decimal\"><\/label>\n    <label>Notes and terms<textarea id=\"ivNotes\" placeholder=\"Payment terms, bank details, thank you note\"><\/textarea><\/label>\n  <\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\"><button class=\"ivb solid\" id=\"ivPdf\" type=\"button\">Download PDF<\/button><button class=\"ivb\" id=\"ivPrint\" type=\"button\">Print<\/button><\/div>\n  <p class=\"note\" id=\"ivMsg\" role=\"status\"><\/p>\n  <div id=\"docp\" aria-label=\"Document preview\"><\/div>\n<\/section>\n<article class=\"prose\">\n\n<h2>How the freelance rate calculator works<\/h2>\n<p>Most freelancers pick an hourly rate by guessing. This calculator works it out. You enter the weekly take-home income you want, your tax rate, the weeks you will not work, the hours you can really bill each week, and your business costs. It returns the hourly rate you need to charge.<\/p>\n<h3>The steps behind the number<\/h3>\n<p>Your yearly take-home is your weekly goal times 52. Dividing that by one minus your tax rate gives the profit you need before tax. Adding your yearly business costs gives the amount you must bill after fees, and dividing again by one minus your payment fee percentage gives the total you must invoice. Finally, that total is divided by your billable hours for the year: the weeks you work times your billable hours per week.<\/p>\n<h3>Why billable hours are lower than a full week<\/h3>\n<p>Admin, sales, emails and learning take time you cannot invoice. Many freelancers bill about 20 to 30 hours in a working week. Using 40 would make your rate too low.<\/p>\n<h3>Business costs<\/h3>\n<p>List your tools, plugins, hosting, domains, storage, stock assets, accounting, equipment, insurance and more. Each item can be entered per month or per year, and the calculator turns them into a yearly total.<\/p>\n<h2>Example<\/h2>\n<p>With a 1,500 weekly goal, a 28% tax rate, 6 weeks off, 25 billable hours a week, a 3% payment fee and about 5,835 a year in business costs, the rate comes to roughly 102 an hour. For a 40-hour project with a 20% buffer, the quote is 48 hours at that rate, about 4,910.<\/p>\n<h2>Frequently asked questions<\/h2>\n<h3>Should I charge hourly or per project?<\/h3>\n<p>Many clients prefer a fixed price. Work out your hourly rate first, estimate the hours, add a buffer for revisions, and quote the total. The calculator shows what you still earn per hour if the project runs 25% over.<\/p>\n<h3>How much deposit should I ask for?<\/h3>\n<p>Many freelancers ask for around half upfront. Set the percentage that suits you and the calculator shows the upfront and final amounts.<\/p>\n<h3>Is the tax calculation accurate?<\/h3>\n<p>It is a planning estimate using one combined rate. Tax rules vary by country and state, and business costs are not always fully deductible. Check your numbers with an accountant.<\/p>\n<h3>Can I quote in my client's currency?<\/h3>\n<p>Yes. Use the currency options and the converter on the page. The exchange rates are a saved snapshot that you can edit, so check the live rate before you send a quote.<\/p>\n\n<div class=\"adslot\"><!-- Ad unit goes here --><\/div>\n<\/article>\n<\/main>\n<footer class=\"site\"><div>\n<a href=\"../about/\">About<\/a> <a href=\"../contact/\">Contact<\/a> <a href=\"../privacy-policy/\">Privacy policy<\/a>\n<p>\u00a9 2026 Pricing Calculators. These calculators give estimates for planning. They are not tax, legal or financial advice.<\/p><\/div><\/footer>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script>\n(function(){\nvar $=function(id){return document.getElementById(id)};\nfunction v(id){var x=parseFloat($(id).value);return isFinite(x)?x:0}\nfunction money(n,d){var s=n<0?\"\u2212\":\"\";return s+$(\"cur\").value+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}\nvar quoteText=\"\";\nvar RATES={USD:1,EUR:0.8933,GBP:0.7538,CAD:1.4219,AUD:1.4266,CHF:0.8334,SEK:9.967,NOK:9.472,DKK:6.677,PLN:3.900,JPY:158.46,SGD:1.28,HKD:7.848,AED:3.6725,SAR:3.75,INR:95.16,PKR:277.9};\nvar ITEMS=[[\"Design and work software\",120,\"m\"],[\"Plugins and extensions\",30,\"m\"],[\"Hosting\",20,\"m\"],[\"Domains\",15,\"y\"],[\"Email, cloud storage and backup\",25,\"m\"],[\"Stock assets, fonts and templates\",20,\"m\"],[\"Project management and invoicing tools\",25,\"m\"],[\"Accounting and bookkeeping\",40,\"m\"],[\"Marketing and portfolio website\",30,\"m\"],[\"Equipment and hardware\",600,\"y\"],[\"Insurance\",40,\"m\"],[\"Coworking or office\",0,\"m\"],[\"Internet and phone\",60,\"m\"],[\"Courses
